<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#6366f1" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="192" height="192" rx="42" fill="url(#bg)"/>
  <rect x="2" y="2" width="188" height="188" rx="40" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
  <g filter="url(#shadow)">
    <!-- Synchronized Twin Play Waves -->
    <circle cx="96" cy="96" r="48" fill="url(#glow)"/>
    <polygon points="86,76 116,96 86,116" fill="#ffffff"/>
    <!-- Orbiting Sync Ring -->
    <circle cx="96" cy="96" r="62" fill="none" stroke="#60a5fa" stroke-width="3" stroke-dasharray="14 10" stroke-linecap="round"/>
  </g>
</svg>

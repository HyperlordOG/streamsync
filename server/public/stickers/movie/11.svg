<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Bottom Slate Board -->
  <rect x="35" y="80" width="130" height="95" rx="8" fill="#1E293B" stroke="#111827" stroke-width="6"/>
  <!-- Text lines on slate -->
  <line x1="50" y1="105" x2="100" y2="105" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>
  <line x1="50" y1="125" x2="120" y2="125" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>
  <line x1="50" y1="145" x2="80" y2="145" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>
  <!-- Slate divider -->
  <line x1="110" y1="135" x2="150" y2="135" stroke="#EF4444" stroke-width="4" stroke-linecap="round"/>
  <!-- Top Clapper Stick (Tilted Open) -->
  <g transform="rotate(-15 35 75)">
    <rect x="35" y="48" width="130" height="28" rx="4" fill="#111827" stroke="#111827" stroke-width="4"/>
    <!-- Diagonal Zebra Stripes -->
    <polygon points="50,48 65,48 50,76 35,76" fill="#F8FAFC"/>
    <polygon points="80,48 95,48 80,76 65,76" fill="#F8FAFC"/>
    <polygon points="110,48 125,48 110,76 95,76" fill="#F8FAFC"/>
    <polygon points="140,48 155,48 140,76 125,76" fill="#F8FAFC"/>
  </g>
  <!-- Hinge bolt -->
  <circle cx="35" cy="76" r="6" fill="#94A3B8" stroke="#111827" stroke-width="3"/>
</svg>

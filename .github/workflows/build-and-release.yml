name: Build & Release StreamSync Native Apps (Android APK & iOS IPA)

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: 🤖 Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: |
          cd streamsync/apps/mobile
          npm install

      - name: Capacitor Add & Sync Android
        run: |
          cd streamsync/apps/mobile
          npx cap add android || true
          npx cap sync android

      - name: Build Android APK
        run: |
          cd streamsync/apps/mobile/android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          mkdir -p ../../../build-artifacts
          cp app/build/outputs/apk/debug/app-debug.apk ../../../build-artifacts/StreamSync.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StreamSync-Android-APK
          path: build-artifacts/StreamSync.apk

  build-ios:
    name: 🍎 Build iOS IPA (AltStore / Sideloading)
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          cd streamsync/apps/mobile
          npm install

      - name: Capacitor Add & Sync iOS
        run: |
          cd streamsync/apps/mobile
          npx cap add ios || true
          npx cap sync ios

      - name: Build iOS Archive (Unsigned for AltStore/SideStore)
        run: |
          cd streamsync/apps/mobile/ios/App
          pod install
          xcodebuild archive \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath ../../../build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r streamsync/apps/mobile/build/App.xcarchive/Products/Applications/App.app Payload/
          zip -r StreamSync.ipa Payload
          mkdir -p build-artifacts
          mv StreamSync.ipa build-artifacts/

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StreamSync-iOS-IPA
          path: build-artifacts/StreamSync.ipa

  publish-release:
    name: 🚀 Publish GitHub Release & Deploy to VPS
    needs: [build-android, build-ios]
    runs-on: ubuntu-latest
    steps:
      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: StreamSync-Android-APK
          path: release-files

      - name: Download iOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: StreamSync-iOS-IPA
          path: release-files

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release-files/StreamSync.apk
            release-files/StreamSync.ipa
          name: StreamSync ${{ github.ref_name }} — Native Mobile Release
          body: |
            ## 🎬 StreamSync Native Mobile Release (${{ github.ref_name }})
            
            ### 📱 Download Links:
            - **Android APK:** Direct install on Samsung, Pixel, Xiaomi, OnePlus.
            - **iOS IPA:** For AltStore, SideStore, TrollStore, Scarlet, or Sideloadly.
            
            ### 🛠️ iOS Installation Instructions:
            1. **AltStore / SideStore:** Open `altstore://install?url=https://streamconnectroshni.duckdns.org/downloads/StreamSync.ipa`
            2. **Safari WebClip (Zero Sideloading):** Visit `https://streamconnectroshni.duckdns.org` in Safari → Tap Share (↑) → Add to Home Screen.
          draft: false
          prerelease: false

name: Build & Release StreamSync Native Apps (Android APK & iOS IPA)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: 🤖 Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies
        run: |
          cd apps/mobile
          npm install

      - name: Capacitor Sync Android
        run: |
          cd apps/mobile
          npx cap sync android

      - name: Build Android APK
        run: |
          cd apps/mobile/android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          mkdir -p $GITHUB_WORKSPACE/build-artifacts
          cp app/build/outputs/apk/debug/app-debug.apk $GITHUB_WORKSPACE/build-artifacts/StreamSync.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StreamSync-Android-APK
          path: build-artifacts/StreamSync.apk

  build-ios:
    name: 🍎 Build iOS IPA (AltStore / Sideloading)
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          cd apps/mobile
          npm install

      - name: Capacitor Sync iOS
        run: |
          cd apps/mobile
          npx cap sync ios

      - name: Build iOS Archive (Unsigned for AltStore/SideStore)
        run: |
          cd apps/mobile/ios/App
          pod install
          xcodebuild archive \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath $GITHUB_WORKSPACE/build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r $GITHUB_WORKSPACE/build/App.xcarchive/Products/Applications/*.app Payload/
          zip -r StreamSync.ipa Payload
          mkdir -p $GITHUB_WORKSPACE/build-artifacts
          mv StreamSync.ipa $GITHUB_WORKSPACE/build-artifacts/

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StreamSync-iOS-IPA
          path: build-artifacts/StreamSync.ipa

  publish-release:
    name: 🚀 Publish GitHub Release
    needs: [build-android, build-ios]
    runs-on: ubuntu-latest
    if: always() && (needs.build-android.result == 'success' || needs.build-ios.result == 'success')
    steps:
      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: StreamSync-Android-APK
          path: release-files

      - name: Download iOS Artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: StreamSync-iOS-IPA
          path: release-files

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.4.1
          files: release-files/*
          name: StreamSync v1.4.1 — Native Mobile Release
          body: |
            ## 🎬 StreamSync Native Mobile Release (v1.4.1)
            
            ### 📱 Download Links:
            - **Android APK:** Direct install on Samsung, Pixel, Xiaomi, OnePlus.
            - **iOS IPA:** For AltStore, SideStore, TrollStore, Scarlet, or Sideloadly.
            
            ### 🛠️ iOS Installation Instructions:
            1. **AltStore / SideStore:** Download `StreamSync.ipa` and open via AltStore or SideStore to sign with your Apple ID.
            2. **Safari WebClip (Zero Sideloading / Recommended):** Visit `https://streamconnectroshni.duckdns.org` in Safari → Tap Share (↑) → Add to Home Screen.
          draft: false
          prerelease: false
